name: Future Pulse PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-validation:
    name: pr-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Hugo Extended
        env:
          HUGO_VERSION: 0.146.0
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Validate editorial metadata and independent reviewer evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/validate-blog-frontmatter.py --base "$BASE_SHA"
          else
            python3 scripts/validate-blog-frontmatter.py
          fi
      - name: Hugo test build (no deployment)
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Berlin
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --gc --minify --baseURL "https://future-pulse.de/"
