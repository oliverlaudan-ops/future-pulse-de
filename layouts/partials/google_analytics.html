{{- /* 
  Cookie-Consent-gesteuertes Google Analytics.
  GA wird NUR geladen, wenn der Nutzer aktiv zugestimmt hat (DSGVO / TDDDG § 25).
  Do Not Track wird ebenfalls respektiert.
  Der eigentliche Banner ist in extend_footer.html.
*/ -}}
<script>
(function() {
  var GA_ID = '{{ site.Config.Services.GoogleAnalytics.ID }}';
  if (!GA_ID) return;

  // Respektiere Do Not Track
  if (navigator.doNotTrack === '1' || window.doNotTrack === '1') return;

  // Prüfe gespeicherte Einwilligung
  var consent = localStorage.getItem('cookie_consent');
  if (consent !== 'accepted') return;

  // GA laden
  var script = document.createElement('script');
  script.async = true;
  script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(script);

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  window.gtag = gtag;
  gtag('js', new Date());
  gtag('config', GA_ID, { 'anonymize_ip': true });
})();
</script>
