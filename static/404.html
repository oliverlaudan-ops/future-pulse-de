<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umgezogen | Future Pulse Tech</title>
  
  <!-- 301 Redirect via JavaScript für GitHub Pages -->
  <script>
    // Hole den aktuellen Pfad und leite zur neuen Domain weiter
    const newPath = window.location.pathname + window.location.search + window.location.hash;
    const newUrl = 'https://future-pulse.de' + newPath;
    
    // 301 Redirect (für SEO wichtig)
    if (window.location.hostname.includes('future-pulse.tech')) {
      window.location.replace(newUrl);
    }
  </script>
  
  <!-- Fallback: Meta Refresh nach 2 Sekunden -->
  <meta http-equiv="refresh" content="2; url=https://future-pulse.de/">
  
  <!-- Canonical für SEO -->
  <link rel="canonical" href="https://future-pulse.de/">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    a {
      color: white;
      text-decoration: underline;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Wir sind umgezogen!</h1>
    <p>
      Diese Seite ist jetzt unter <strong>future-pulse.de</strong> zu Hause.<br>
      Du wirst automatisch weitergeleitet...
    </p>
    <div class="spinner"></div>
    <p style="font-size: 1rem; margin-top: 2rem;">
      Falls nichts passiert: <a href="https://future-pulse.de/">Hier klicken</a>
    </p>
  </div>
</body>
</html>
